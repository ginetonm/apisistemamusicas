name: CI/CD - API Sistema de Músicas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Instalar Node
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 3. Instalar dependências
      - name: Instalar dependências
        run: npm install

      # 4. Configurar variáveis de ambiente para os testes
      - name: Criar arquivo .env para os testes
        run: |
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      # 5. Rodar testes
      - name: Rodar testes automatizados
        run: npm test

# Deploy usando API REST do Render
      - name: Deploy no Render
        if: github.event_name == 'push'
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -d ''
